<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Calibri and Georgia are what the decks name; these are their metric clones. -->
<fontconfig>
  <alias binding="same">
    <family>Calibri</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Georgia</family>
    <accept><family>Gelasio</family></accept>
  </alias>
</fontconfig>
